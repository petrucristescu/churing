name: Build and Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-22.04

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: churingtest
          MYSQL_DATABASE: churingdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pchuringtest --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=6

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0   # full history needed for changelog generation

      # System packages must be installed on every run — not cached.
      # LLVM 18 shared libs must be present at link time regardless of opam cache state.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap gcc g++ cmake lsb-release software-properties-common gnupg
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo bash /tmp/llvm.sh 18
          sudo apt-get install -y llvm-18-dev clang-18 libzstd-dev zlib1g-dev
          sudo ln -sf /usr/bin/llvm-config-18 /usr/local/bin/llvm-config

      - name: Setup OCaml cache
        id: setup-cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.opam
            _opam
            /usr/local/bin/opam
            /home/runner/.local/bin/opam
          key: ${{ runner.os }}-ocaml-${{ hashFiles('*.opam', '**/*.opam') }}-v3

      - name: Install OCaml and opam packages
        if: steps.setup-cache.outputs.cache-hit != 'true'
        run: |
          wget https://github.com/ocaml/opam/releases/download/2.1.5/opam-2.1.5-x86_64-linux -O /tmp/opam
          sudo mv /tmp/opam /usr/local/bin/opam
          sudo chmod +x /usr/local/bin/opam
          opam init --disable-sandboxing --no-setup --compiler=ocaml-base-compiler.5.1.1 -y
          opam update && opam install conf-llvm-shared.18 dune alcotest llvm -y

      - name: Seed database
        run: mysql -h 127.0.0.1 -u root -pchuringtest churingdb < test/db/init.sql

      - name: Build
        run: |
          eval $(opam env)
          dune build src/churing.exe

      - name: Run unit tests
        run: |
          eval $(opam env)
          dune runtest

      - name: Run integration tests
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: churingtest
          MYSQL_DATABASE: churingdb
        run: |
          eval $(opam env)
          mkdir -p test_results
          failed=0
          for test_file in src/test/*.ch; do
            test_name=$(basename "$test_file" .ch)
            expected_output="src/test/${test_name}.ch.out"

            _build/default/src/churing.exe "$test_file" > "test_results/${test_name}.out" 2>&1
            exit_code=$?

            if [ -f "$expected_output" ]; then
              if ! diff -u "test_results/${test_name}.out" "$expected_output"; then
                echo "FAIL: $test_name"
                failed=1
              else
                echo "PASS: $test_name"
              fi
            elif [ "$exit_code" -ne 0 ]; then
              echo "FAIL: $test_name (exit code $exit_code)"
              cat "test_results/${test_name}.out"
              failed=1
            else
              echo "PASS: $test_name"
            fi
          done
          if [ "$failed" -eq 1 ]; then
            echo "Some tests failed!"
            exit 1
          fi

      # ── Release steps — only on successful master push, not PRs ──────────────

      - name: Prepare release artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        id: prep
        run: |
          VERSION=$(cat VERSION)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          ARTIFACT="churing-v${VERSION}-linux-amd64"
          cp _build/default/src/churing.exe "$ARTIFACT"
          chmod +x "$ARTIFACT"
          echo "artifact=${ARTIFACT}" >> "$GITHUB_OUTPUT"

          # Changelog: commits since the last release tag (or full log if none)
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          {
            echo "## Changes"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              git log "${PREV_TAG}..HEAD" --no-merges --pretty="- %s" \
                | grep -v "^- chore: bump version"
            else
              git log --no-merges --pretty="- %s" | head -30
            fi
            echo ""
            echo "## Download"
            echo ""
            echo "\`${ARTIFACT}\` — Churing interpreter, Linux x86-64"
          } > release_notes.md
          echo "--- release notes ---"
          cat release_notes.md

      - name: Create GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.prep.outputs.version }}
          ARTIFACT=${{ steps.prep.outputs.artifact }}
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists — skipping"
          else
            gh release create "v${VERSION}" "${ARTIFACT}" \
              --title "churing v${VERSION}" \
              --notes-file release_notes.md
          fi

      - name: Bump version
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          VERSION=$(cat VERSION)
          IFS='.' read -r major minor patch <<< "$VERSION"
          NEW_VERSION="${major}.${minor}.$((patch + 1))"
          echo "$NEW_VERSION" > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          if git diff --staged --quiet; then
            echo "Version already bumped — nothing to commit"
          else
            git commit -m "chore: bump version to ${NEW_VERSION}"
            git push
          fi
